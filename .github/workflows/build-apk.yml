name: Build & Release Bolnaa APK

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'whisper-flow-android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x whisper-flow-android/gradlew

      - name: Build Debug APK
        working-directory: whisper-flow-android
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename & Prepare APKs
        run: |
          mkdir -p build-output
          cp whisper-flow-android/app/build/outputs/apk/debug/app-debug.apk build-output/bolnaa.apk
          cp whisper-flow-android/app/build/outputs/apk/debug/app-debug.apk build-output/whisper-flow.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bolnaa-apk
          path: build-output/bolnaa.apk
          retention-days: 30

      - name: Create or Update GitHub Release (Live Download Link)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "Bolnaa Latest Build"
          body: |
            ### 🎙️ Bolnaa Latest Build
            - Built automatically from commit: `${{ github.sha }}`
            - **Download Bolnaa APK**: [bolnaa.apk](https://github.com/${{ github.repository }}/releases/download/latest/bolnaa.apk)
            
            #### How to Install:
            1. Download `bolnaa.apk` on your Android phone.
            2. Tap to install.
            3. Future updates pushed here will automatically update the app over-the-air!
          draft: false
          prerelease: false
          files: |
            build-output/bolnaa.apk
            build-output/whisper-flow.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
