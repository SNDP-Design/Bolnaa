name: Build & Release Bolnaa APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Grant execute permission for gradlew
        run: chmod +x whisper-flow-android/gradlew

      - name: Build Debug APK
        working-directory: whisper-flow-android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK Outputs
        run: |
          mkdir -p build-output
          cp whisper-flow-android/app/build/outputs/apk/debug/app-debug.apk build-output/bolnaa.apk
          cp whisper-flow-android/app/build/outputs/apk/debug/app-debug.apk build-output/whisper-flow.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bolnaa-apk
          path: build-output/bolnaa.apk
          retention-days: 30

      - name: Delete old release tag if exists
        continue-on-error: true
        run: |
          git tag -d latest || true
          git push origin :refs/tags/latest || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release (Direct Download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Bolnaa Latest Build"
          body: |
            ### 🎙️ Bolnaa Latest Android Build
            - Commit: `${{ github.sha }}`
            - **Download Bolnaa APK**: [bolnaa.apk](https://github.com/${{ github.repository }}/releases/download/latest/bolnaa.apk)
            
            #### How to Install:
            1. Download `bolnaa.apk` on your Android phone.
            2. Tap to install.
            3. Future updates pushed here will automatically update the app over-the-air!
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build-output/bolnaa.apk
            build-output/whisper-flow.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
