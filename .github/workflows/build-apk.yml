name: Build & Release Bolnaa APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Grant execute permission for gradlew
        run: chmod +x whisper-flow-android/gradlew

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore whisper-flow-android/app/release.keystore \
            -alias bolnaa -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass bolnaapassword -keypass bolnaapassword \
            -dname "CN=Bolnaa, OU=Voice, O=BolnaaApp, L=Bangalore, S=KA, C=IN"

      - name: Build Signed Release APK
        working-directory: whisper-flow-android
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Prepare APK Outputs
        run: |
          mkdir -p build-output
          APK_PATH=$(find whisper-flow-android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found generated APK at: $APK_PATH"
          cp "$APK_PATH" build-output/bolnaa.apk
          cp "$APK_PATH" build-output/whisper-flow.apk
          ls -lh build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bolnaa-apk
          path: build-output/bolnaa.apk
          retention-days: 30

      - name: Delete old release tag if exists
        continue-on-error: true
        run: |
          git tag -d latest || true
          git push origin :refs/tags/latest || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release (Direct Download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Bolnaa Latest Build"
          body: |
            ### 🎙️ Bolnaa Latest Android Build
            - Commit: `${{ github.sha }}`
            - **Download Bolnaa APK**: [bolnaa.apk](https://github.com/${{ github.repository }}/releases/download/latest/bolnaa.apk)
            
            #### How to Install on Xiaomi / Redmi / Android:
            1. Download `bolnaa.apk` on your phone.
            2. If Google Play Protect shows a warning:
               - Open **Play Store** -> Tap Profile Icon -> **Play Protect** -> **⚙️ Settings** -> Turn OFF **"Scan apps with Play Protect"**.
            3. Tap to install `bolnaa.apk`.
            4. On Xiaomi/MIUI: Enable **"Allow restricted settings"** under App Info to enable Accessibility service.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build-output/bolnaa.apk
            build-output/whisper-flow.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
