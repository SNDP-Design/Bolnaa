<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#312E81" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#grad)" filter="url(#shadow)"/>
  
  <!-- Subtle inner border highlight -->
  <rect x="9" y="9" width="110" height="110" rx="27" fill="none" stroke="white" stroke-width="2" stroke-opacity="0.2"/>
  
  <!-- Back Copy Sheet (Tilted/Offset) -->
  <rect x="44" y="28" width="50" height="62" rx="8" fill="white" fill-opacity="0.35" stroke="white" stroke-opacity="0.6" stroke-width="2.5"/>
  
  <!-- Front Copy Sheet -->
  <rect x="30" y="42" width="50" height="62" rx="8" fill="white" filter="url(#shadow)"/>
  
  <!-- Link / Clipboard details on front sheet -->
  <rect x="40" y="54" width="30" height="5" rx="2.5" fill="#6366F1"/>
  <rect x="40" y="65" width="22" height="5" rx="2.5" fill="#94A3B8"/>
  <rect x="40" y="76" width="26" height="5" rx="2.5" fill="#CBD5E1"/>
  <circle cx="68" cy="88" r="7" fill="url(#accent)"/>
  <path d="M65.5 88L67.5 90L71 86.5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>